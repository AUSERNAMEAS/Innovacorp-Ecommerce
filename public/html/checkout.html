<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Fake Shop</title>
    <link rel="stylesheet" href="../css/checkout.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>

</head>
<body>
    
    <div class="container">
        <h1>Datos de Envío y Pago</h1>
        <form id="checkout-form">
            <div class="form-section">
                <h2>Datos de Envío</h2>
                <div class="form-group">
                    <label for="name">Nombre(s)</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="lastname">Apellido(s)</label>
                    <input type="text" id="lastname" required>
                </div>
                <div class="form-group">
                    <label for="address">Dirección</label>
                    <input type="text" id="address" placeholder="Calle, número, colonia" required>
                </div>
                <div class="form-group">
    <label for="state">Estado</label>
    <select id="state" name="state" required>
        <option value="" disabled selected>Selecciona tu estado</option>
        <option value="Aguascalientes">Aguascalientes</option>
        <option value="Baja California">Baja California</option>
        <option value="Baja California Sur">Baja California Sur</option>
        <option value="Campeche">Campeche</option>
        <option value="Chiapas">Chiapas</option>
        <option value="Chihuahua">Chihuahua</option>
        <option value="Ciudad de México">Ciudad de México</option>
        <option value="Coahuila">Coahuila</option>
        <option value="Colima">Colima</option>
        <option value="Durango">Durango</option>
        <option value="Estado de México">Estado de México</option>
        <option value="Guanajuato">Guanajuato</option>
        <option value="Guerrero">Guerrero</option>
        <option value="Hidalgo">Hidalgo</option>
        <option value="Jalisco">Jalisco</option>
        <option value="Michoacán">Michoacán</option>
        <option value="Morelos">Morelos</option>
        <option value="Nayarit">Nayarit</option>
        <option value="Nuevo León">Nuevo León</option>
        <option value="Oaxaca">Oaxaca</option>
        <option value="Puebla">Puebla</option>
        <option value="Querétaro">Querétaro</option>
        <option value="Quintana Roo">Quintana Roo</option>
        <option value="San Luis Potosí">San Luis Potosí</option>
        <option value="Sinaloa">Sinaloa</option>
        <option value="Sonora">Sonora</option>
        <option value="Tabasco">Tabasco</option>
        <option value="Tamaulipas">Tamaulipas</option>
        <option value="Tlaxcala">Tlaxcala</option>
        <option value="Veracruz">Veracruz</option>
        <option value="Yucatán">Yucatán</option>
        <option value="Zacatecas">Zacatecas</option>
    </select>
</div>
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" required>
                </div>
            </div>

            <div class="form-section">
                <h2>Forma de Pago</h2>
                <div id="paypal-button-container" style="display:none;"></div>

                
            </div>
        </form>

        <div class="order-summary" style="flex: 1; border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
            <h2>Resumen del Pedido</h2>
            <div id="cart-items-container">
                <!-- Aquí se renderizarán los productos -->
            </div>
            <hr>
            <div id="cart-total" style="font-weight: bold; font-size: 1.2em; margin-top: 10px;">
                Total: $0.00
            </div>
        </div>
    </div>

    <script src="../javascript/checkout.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AWW4y9AZqu23FG8wnl7UQH7UjO2dRbixd29TsM3Xr3Y_68qu6t1Y73mG0ZvXjEPmGE75OVTnNkm8QGGt&currency=MXN"></script>

</body>
</html>
